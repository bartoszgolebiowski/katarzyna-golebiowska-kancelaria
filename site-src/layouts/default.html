<!doctype html>
<html lang="pl">
  <head>
    <!-- Google Consent Mode v2 – domyślne odrzucenie (musi być przed gtag.js) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("consent", "default", {
        analytics_storage: "denied",
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        wait_for_update: 500,
      });
    </script>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-KWQ8WM1NPQ"
    ></script>
    <script>
      gtag("js", new Date());
      gtag("config", "G-KWQ8WM1NPQ");
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="robots" content="{{robots}}" />
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{canonical}}" />
    <!-- Open Graph -->
    <meta property="og:type" content="{{og_type}}" />
    <meta
      property="og:site_name"
      content="Kancelaria Notarialna Katarzyna Gołębiowska"
    />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:url" content="{{canonical}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:image" content="{{og_image}}" />
    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{og_image}}" />
    <link rel="icon" type="image/svg+xml" href="{{relativeRoot}}assets/favicon.ico" />
    <link rel="apple-touch-icon" href="{{relativeRoot}}assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="{{relativeRoot}}assets/fonts.css" />
    <link rel="stylesheet" href="{{relativeRoot}}assets/style.css" />
    {{schema_json}}
  </head>
  <body>
    <a class="skip-link" href="#main">Przejdź do treści</a>
    {{header}}
    <main id="main">
      {{content}}
    </main>
    {{footer}}
    <button class="back-to-top" type="button" aria-label="Wróć na górę">
      ↑
    </button>
    <script src="{{relativeRoot}}assets/scripts/consent.js"></script>
    <script src="{{relativeRoot}}assets/scripts/script.js"></script>
  </body>
</html>
